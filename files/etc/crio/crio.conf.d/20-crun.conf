# Sorts after the cri-o package's own 10-crio.conf, which is the only config it
# ships on F44 -- there is no /etc/crio/crio.conf any more.
[crio.runtime]
default_runtime = "crun"
disable_hostport_mapping = true

[crio.runtime.runtimes.crun]
allowed_annotations = [
    "io.containers.trace-syscall",
]
