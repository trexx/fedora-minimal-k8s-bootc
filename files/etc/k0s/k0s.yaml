apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: k0s
spec:
  api:
    sans:
    - 192.168.0.10
  network:
    podCIDR: 10.244.0.0/24
    # Cilium is installed separately and replaces kube-proxy, so k0s deploys neither.
    kubeProxy:
      disabled: true
    provider: custom
  telemetry:
    enabled: false
