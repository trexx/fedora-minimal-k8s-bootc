apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: k0s
spec:
  workerProfiles:
    - name: crio-cgroup-systemd
      values:
        cgroupDriver: systemd
  api:
    # Extra SAN for the API server certificate. The host takes its address by DHCP
    # (files/usr/lib/systemd/network/89-ethernet.network), so this has to be a reservation
    # on the router: k0s also adds whatever address the host actually gets, but anything
    # pointed at this one stops working if the lease ever changes.
    sans:
    - 192.168.0.10
  network:
    podCIDR: 10.244.0.0/24
    kubeProxy:
      disabled: true
    provider: custom
  storage:
    type: etcd
  telemetry:
    enabled: false
