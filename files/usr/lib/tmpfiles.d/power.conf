# CPU power settings this host previously got from TLP, written once at boot by
# systemd-tmpfiles. "w" lines are skipped when the path does not exist, so a knob missing
# on this CPU is not an error. Device-level settings that need to follow hotplug live in
# /usr/lib/udev/rules.d/80-power.rules; PCIe ASPM is a kernel argument in
# /usr/lib/bootc/kargs.d/10-server.toml; the NMI watchdog is a sysctl in
# /usr/lib/sysctl.d/91-power.conf.
#
# Deliberately NOT carried over from the old tlp.d config:
#   CPU_MAX_PERF_ON_AC=100, CPU_BOOST_ON_AC=1 - max_perf_pct=100 and no_turbo=0 are the
#                            kernel defaults, and no_turbo rejects writes when firmware
#                            has disabled turbo, which would fail systemd-tmpfiles-setup
#   SCHED_POWERSAVE_ON_AC  - targets sched_mc_power_savings, removed from the kernel years ago
#   DISK_IOSCHED="keep"    - means "change nothing"
#   WOL_DISABLE            - Wake-on-LAN only matters for a machine that sleeps, and
#                            sleep/suspend/hibernate targets are masked on this host

# CPU_SCALING_GOVERNOR_ON_AC=powersave, CPU_ENERGY_PERF_POLICY_ON_AC=power. The governor
# goes first: intel_pstate rejects EPP writes under the performance governor.
w /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor - - - - powersave
w /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference - - - - power

# CPU_MIN_PERF_ON_AC=20, CPU_HWP_DYN_BOOST_ON_AC=1.
w /sys/devices/system/cpu/intel_pstate/min_perf_pct - - - - 20
w /sys/devices/system/cpu/intel_pstate/hwp_dynamic_boost - - - - 1
